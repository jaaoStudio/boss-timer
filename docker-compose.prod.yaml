services:
  db:
    image: postgres:latest
    platform: linux/arm64
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - boss_network
    ports:
      - "4521:5432"
    volumes:
      - ./db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d

  boss_service:
    image: ${REMOTE_REGISTRY_IP}/boss_service/boss_service:${BACKEND_VERSION}
    platform: linux/arm64
    container_name: boss_service
    ports:
      - "1254:1254"
    command: uvicorn app.main:app --host 0.0.0.0 --port 1254 --root-path /api --proxy-headers --forwarded-allow-ips="*"
    env_file:
      - .env
    volumes:
      - ./app/maintenance.json:/app/maintenance.json # 掛載維護公告設定檔
    restart: always
    networks:
      - boss_network
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1254/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  boss_timer_nginx:
    image: ${REMOTE_REGISTRY_IP}/boss_service/boss_timer_nginx:${FRONTEND_VERSION}
    platform: linux/arm64
    container_name: boss_timer_nginx
    ports:
      - "2255:80"
    volumes:
      - ./frontend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro # 掛載 Nginx 設定檔 (唯讀)
    restart: always
    networks:
      - boss_network
    depends_on:
      boss_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    container_name: boss_redis_prod
    restart: always
    networks:
      - boss_network
    ports:
      - "6381:6379"

  celery_worker_fast:
    image: ${REMOTE_REGISTRY_IP}/boss_service/boss_service:${BACKEND_VERSION}
    platform: linux/arm64
    container_name: boss_celery_worker_fast_prod
    command: celery -A app.celery_app worker -Q celery --concurrency=4 --loglevel=info
    env_file:
      - .env
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
    restart: always
    networks:
      - boss_network
    depends_on:
      - redis
      - db

  celery_worker_discord:
    image: ${REMOTE_REGISTRY_IP}/boss_service/boss_service:${BACKEND_VERSION}
    platform: linux/arm64
    container_name: boss_celery_worker_discord_prod
    command: celery -A app.celery_app worker -Q discord_queue --concurrency=1 --loglevel=info
    env_file:
      - .env
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
    restart: always
    networks:
      - boss_network
    depends_on:
      - redis
      - db

networks:
  boss_network:
    driver: bridge

volumes:
  boss_data:
    driver: local
