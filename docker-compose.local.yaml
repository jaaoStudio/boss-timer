services:
  boss_service:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: boss_service_local
    ports:
      - "1254:1254"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 1254 --root-path /api --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - ./app/.env:/project/.env
      - ./app/maintenance.json:/app/maintenance.json
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: always
    networks:
      - boss_network
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1254/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  boss_timer_nginx:
    build:
      context: ./frontend
    container_name: boss_timer_nginx_local
    ports:
      - "2255:80"
    volumes:
      - ./frontend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    networks:
      - boss_network
    depends_on:
      boss_service:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: boss_redis_local
    restart: always
    networks:
      - boss_network
    ports:
      - "6381:6379"

  celery_worker_fast:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: boss_celery_worker_fast_local
    command: celery -A app.celery_app worker -Q celery --concurrency=4 --loglevel=info
    volumes:
      - ./app/.env:/project/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: always
    networks:
      - boss_network
    depends_on:
      - redis

  celery_worker_discord:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: boss_celery_worker_discord_local
    command: celery -A app.celery_app worker -Q discord_queue --concurrency=1 --loglevel=info
    volumes:
      - ./app/.env:/project/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: always
    networks:
      - boss_network
    depends_on:
      - redis

networks:
  boss_network:
    driver: bridge