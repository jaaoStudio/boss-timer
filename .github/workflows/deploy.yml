name: Build & Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.agent/**'
      - 'docs/**'

env:
  HARBOR: ${{ secrets.HARBOR_URL }}
  IMAGE_BACKEND: ${{ secrets.HARBOR_URL }}/boss_service/boss_service
  IMAGE_FRONTEND: ${{ secrets.HARBOR_URL }}/boss_service/boss_timer_nginx

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（arm64 支援）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_BACKEND }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BACKEND }}:cache,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          build-args: |
            VITE_GTM_ID=${{ secrets.VITE_GTM_ID }}
            VITE_ANALYTICS_ID=${{ secrets.VITE_ANALYTICS_ID }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}
            VITE_APP_BASE_URL=/api
            VITE_BASE_PUBLIC_PATH=/
            VITE_APP_TITLE=BOSS
            VITE_CLARITY_ID=${{ secrets.VITE_CLARITY_ID }}

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: ~/boss-tracker/deploy.sh ${{ github.sha }}