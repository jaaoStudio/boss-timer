name: Build & Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.agent/**'
      - '.agents/**'
      - '.claude/**'
      - 'docs/**'

jobs:
  # 建置不等部署，前後端並行。較新的 commit 開始建置時取消較舊的建置（較新的已包含它的變更），
  # 所以較舊的 commit 不會比較新的晚建好、排在新版之後部署把正式機降回舊版。
  # 群組不分 commit：重新執行舊的 run 會取消較新的建置，要回到舊版請用 Rollback workflow
  build:
    # 正式機是 arm64：用原生 arm64 runner 建置，不經過 QEMU 模擬（public repo 免費）
    runs-on: ubuntu-24.04-arm
    # 正常約 5～10 分鐘；卡住時提早失敗，不要等到 GitHub 的 6 小時上限
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-${{ matrix.image }}
      cancel-in-progress: true
    strategy:
      matrix:
        include:
          - image: boss_service
            context: .
            file: app/Dockerfile
          - image: boss_timer_nginx
            context: ./frontend
            file: frontend/Dockerfile
            vite: true
    env:
      IMAGE: ${{ secrets.HARBOR_URL }}/boss_service/${{ matrix.image }}
      # matrix 裡不能用 secrets，Vite 建置參數放在這裡，只傳給 vite: true 的前端
      FRONTEND_BUILD_ARGS: |
        VITE_GTM_ID=${{ secrets.VITE_GTM_ID }}
        VITE_ANALYTICS_ID=${{ secrets.VITE_ANALYTICS_ID }}
        VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        VITE_WS_URL=${{ secrets.VITE_WS_URL }}
        VITE_APP_BASE_URL=/api
        VITE_BASE_PUBLIC_PATH=/
        VITE_APP_TITLE=BOSS
        VITE_CLARITY_ID=${{ secrets.VITE_CLARITY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: ${{ matrix.vite && env.FRONTEND_BUILD_ARGS || '' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 前一個還在部署時排隊，排隊中的舊 job 會被更新的取代；回滾與手動執行由正式機上 deploy/lib.sh 的 flock 互斥
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # 須大於 SSH 部署的 command_timeout（20 分鐘），避免切換到一半被砍
    timeout-minutes: 25
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # 須大於 lib.sh 等部署鎖的上限（10 分鐘）＋部署本身的時間
          command_timeout: 20m
          script: ~/boss-tracker/deploy.sh ${{ github.sha }}
